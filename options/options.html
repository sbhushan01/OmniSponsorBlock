<!DOCTYPE html>
<html lang="en">
<head>
  <title>__MSG_Options__ - OmniSponsorBlock</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" /> 
  <link rel="icon" href="../icons/IconSponsorBlocker32px.png" type="image/png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="options.css" rel="stylesheet"/>
  <link href="../shared.css" rel="stylesheet"/>

  <script src="../js/options.js" defer></script>
</head>

<body class="sponsorBlockPageBody">

	<div id="options-container">

		<div id="menubar" class="center">

			<div id="title" class="titleBar">
				<img id="title-bar-logo" src="../icons/LogoSponsorBlocker256px.png" class="profilepic" alt="SponsorBlock logo"/>
				OmniSponsorBlock
				<div id="version"></div>
			</div>

			<div id="navigation">
                <!-- Navigation tabs removed as OmniSponsorBlock only supports a unified settings view -->
		    </div>

			<div id="createdBy" class="titleBar">
				<div>
					<img src="../icons/newprofilepic.jpg" height="30" class="profilepiccircle" alt="profile picture of creator"/>
					__MSG_createdBy__ 
					<a href="https://ajay.app">Ajay Ramachandran</a> 
				</div>
				<a href="https://sponsor.ajay.app/donate" target="_blank" rel="noopener" id="sbDonate">(__MSG_Donate__)</a>
			</div>

		</div>

		<div id="options" style="padding: 20px;">
            <div id="settings"></div>
		</div>

	</div>

    <script>
      // Automatically translate __MSG_ keys in the DOM since this is a custom options page
      document.addEventListener("DOMContentLoaded", () => {
          const replaceText = (node) => {
              if (node.nodeType === Node.TEXT_NODE) {
                  node.textContent = node.textContent.replace(/__MSG_(\w+)__/g, (match, key) => {
                      return chrome.i18n.getMessage(key) || match;
                  });
              } else if (node.nodeType === Node.ELEMENT_NODE) {
                  for (let attr of node.attributes) {
                      attr.value = attr.value.replace(/__MSG_(\w+)__/g, (match, key) => {
                          return chrome.i18n.getMessage(key) || match;
                      });
                  }
                  for (let child of node.childNodes) {
                      replaceText(child);
                  }
              }
          };
          replaceText(document.documentElement);
          document.title = document.title.replace(/__MSG_(\w+)__/g, (match, key) => {
              return chrome.i18n.getMessage(key) || match;
          });
      });
    </script>

</body>
</html>
