<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniSponsorBlock</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.5;
      }
      ul {
        margin: 0;
        padding-left: 20px;
      }
      li {
        margin: 8px 0;
      }
      a {
        color: #7dd3fc;
      }
      a:hover {
        color: #bae6fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OmniSponsorBlock</h1>
      <p>One extension for skipping sponsored segments on YouTube videos and Spotify podcasts.</p>
      <ul>
        <li><a href="https://github.com/sbhushan01/OmniSponsorBlock">GitHub Repository</a></li>
        <li><a href="./updates.xml">Chrome/Edge update manifest (updates.xml)</a></li>
        <li><a href="./updates.json">Firefox update manifest (updates.json)</a></li>
      </ul>
    </main>
  </body>
</html>
